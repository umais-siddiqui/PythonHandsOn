name: Claude API Call

on:
  push:
    branches:
      - umais-siddiqui

jobs:
  call-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t claude-api-call .

      - name: Run API call script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: docker run --rm -e ANTHROPIC_API_KEY claude-api-call
